# SPDX-License-Identifier: AGPL-3.0-or-later
# Licensing information for files that cannot carry a header (Markdown,
# JSON, SVG, plain text). Source files carry their own
# "SPDX-License-Identifier: AGPL-3.0-or-later" header; the copyright notice
# for all files is given here. Checked by `reuse lint` in CI.
version = 1

[[annotations]]
path = "**"
precedence = "closest"
SPDX-FileCopyrightText = "2026 The growcontroller-software contributors"
SPDX-License-Identifier = "AGPL-3.0-or-later"

# Verbatim Apache License 2.0 text, shipped with the license notices of
# nlohmann/json (tools/third_party.mjs).
[[annotations]]
path = "tools/licenses/Apache-2.0.txt"
precedence = "override"
SPDX-FileCopyrightText = "The Apache Software Foundation"
SPDX-License-Identifier = "Apache-2.0"
