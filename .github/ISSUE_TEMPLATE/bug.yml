name: Bug report
description: Something does not work as described.
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you! Please do not post passwords, access tokens or keys (also not from ESPHome YAML: the `api` key, the `ota` password, Wi-Fi details), the address of your Home Assistant or locations – issues are public.
        Did you use "Report a problem" in the app? Then the **report ID** (GC-…) is filled in; please share the diagnostic package only when we ask, after a look at what it holds.
        Not a bug, but feedback or an idea? Please use [Discussions](https://github.com/Wokesay/growcontroller-software/discussions). A vulnerability? Never here: see [SECURITY.md](https://github.com/Wokesay/growcontroller-software/blob/main/SECURITY.md).
  - type: textarea
    id: what
    attributes:
      label: What happened?
      placeholder: e.g. The mix stopped at part B with the message "Blockage detected".
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: What you did, one step per line, so that we can try it too.
      placeholder: |
        1. Simulator, demo scenario
        2. Mixing › 40 L › Start mixing
        3. …
  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
  - type: input
    id: version
    attributes:
      label: Software version
      description: Settings › Display and info
      placeholder: 0.1.0-proto.4
    validations:
      required: true
  - type: input
    id: report
    attributes:
      label: Report ID from "Report a problem"
      placeholder: GC-1a2b3c4d
  - type: dropdown
    id: hardware
    attributes:
      label: Where did it happen?
      options:
        - Simulator
        - Home Assistant app
        - hub (prototype)
        - self-built (breadboard or own board)
    validations:
      required: true
  - type: input
    id: system
    attributes:
      label: Browser and system
      description: Where you opened the app; for the Home Assistant app also Home Assistant's version.
      placeholder: e.g. Firefox 133 on Windows 11; Safari on iPhone (iOS 18); Home Assistant 2026.10
  - type: dropdown
    id: level
    attributes:
      label: Expansion stage
      options:
        - "Stage 0: mixing only"
        - "Stage 1: pH/EC"
        - "Stage 2: level/inlet"
        - "Stage 3–4"
        - "Don't know"
  - type: checkboxes
    id: safety
    attributes:
      label: Safety
      options:
        - label: A pump ran although it should not have, or did not switch off (please report right away).
