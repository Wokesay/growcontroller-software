# Dependency updates (#29). Actions stay pinned by commit SHA, the Home
# Assistant app's base image by digest; Dependabot updates the SHA and the
# version comment (tools/workflows.test.mjs) and the digest.
# cooldown: a new release waits a week before it is proposed, so a hijacked
# release is more likely noticed first.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      minor-and-patch:
        update-types: [minor, patch]
  # Base image of the Home Assistant app (SD-034), pinned by digest
  - package-ecosystem: docker
    directory: /ha/app
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
