# Dependency updates (#29). Actions stay pinned by commit SHA; Dependabot
# updates the SHA and the version comment (tools/workflows.test.mjs).
# cooldown: a new release waits a week before it is proposed, so a hijacked
# release is more likely noticed first. Pull requests that change
# workflows get the review for CI files.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      minor-and-patch:
        update-types: [minor, patch]
