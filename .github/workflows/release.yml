# SPDX-License-Identifier: AGPL-3.0-or-later
# Release: a tag vX.Y.Z[-...] on main produces the downloads (simulator for
# Windows, macOS and Linux, web app), SBOMs, checksums and a provenance
# attestation as a GitHub release with the matching CHANGELOG section, and
# the Home Assistant app image (SD-034) in the GitHub container registry.
# The firmware image goes into a release only once it is signed offline
# (docs/RELEASE.md) – never from CI; CI still builds it on every run.
# Channels (PD-036) are not told apart yet (#19).
#
# Jobs (#29): `verify` checks version and tag, `packages`, `build` and
# `app-*` make every file and image without write access, `publish` only
# checks the checksums, attests, pushes the app image and creates the
# release; it runs no npm and no build.
# A PR that changes the release machinery runs everything except
# `publish` as a dry run.
name: Release
on:
  push:
    tags: ["v*"]
  pull_request:
    paths:
      - .github/workflows/release.yml
      - .github/workflows/packages.yml
      - .github/workflows/app.yml
      - ha/app/**
      - .dockerignore
      - repository.yaml
      - tools/package.sh
      - tools/third_party.mjs
      - tools/sbom_cpp.mjs
      - cmake/deps.cmake
      - tools/embed_web.mjs
      - sim/README.txt
      - web/package.json
      - web/package-lock.json
      - VERSION
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
defaults:
  run:
    # -eo pipefail: a failing command in a pipe fails the step
    shell: bash
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # main as well, to check that the tag points at a commit on it
          fetch-depth: 0
      - name: Version and tag
        id: version
        env:
          EVENT: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [ "$(grep -c . VERSION)" != 1 ]; then
            echo "::error::VERSION must have exactly one line"; exit 1
          fi
          v="$(tr -d '\r\n' < VERSION)"
          if ! printf '%s' "$v" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$'; then
            echo "::error::VERSION is not a version: $v"; exit 1
          fi
          web=$(node -p "require('./web/package.json').version")
          if [ "$web" != "$v" ]; then
            echo "::error::web/package.json has $web, VERSION has $v"; exit 1
          fi
          # Home Assistant installs the image tagged with the app's version.
          if ! grep -qxF "version: \"$v\"" ha/app/config.yaml; then
            echo "::error::ha/app/config.yaml does not have version \"$v\""; exit 1
          fi
          # Checked on every run, so the dry run proves the tag check can work.
          if ! git rev-parse -q --verify origin/main > /dev/null; then
            echo "::error::origin/main was not fetched"; exit 1
          fi
          if [ "$EVENT" = push ]; then
            if [ "v$v" != "$REF_NAME" ]; then
              echo "::error::Tag $REF_NAME does not match VERSION $v"; exit 1
            fi
            rc=0; git merge-base --is-ancestor HEAD origin/main || rc=$?
            case "$rc" in
              0) ;;
              1) echo "::error::Tag $REF_NAME is not on main"; exit 1 ;;
              *) echo "::error::Could not compare $REF_NAME with main"; exit 1 ;;
            esac
            if ! awk -v s="## [$v]" 'index($0, s) == 1 {f=1} END {exit !f}' CHANGELOG.md; then
              echo "::error::CHANGELOG.md has no section [$v]"; exit 1
            fi
          fi
          echo "version=$v" >> "$GITHUB_OUTPUT"

  packages:
    needs: verify
    uses: ./.github/workflows/packages.yml
    with:
      release: true

  # The Home Assistant app image (SD-034), one per architecture
  app-amd64:
    needs: verify
    uses: ./.github/workflows/app.yml
    with:
      arch: amd64
      release: true

  app-aarch64:
    needs: verify
    uses: ./.github/workflows/app.yml
    with:
      arch: aarch64
      release: true

  build:
    needs: [verify, packages]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      sums: ${{ steps.files.outputs.sums }}
      notes: ${{ steps.files.outputs.notes }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          # No cache in a release build.
          package-manager-cache: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          # One folder per artifact: a second artifact cannot overwrite a
          # package with the same file name.
          pattern: growcontroller-simulator-*
          path: out/pkgs
      - name: Web app, licenses, SBOMs, checksums, release notes
        id: files
        env:
          EVENT: ${{ github.event_name }}
          VERSION: ${{ needs.verify.outputs.version }}
          GC_SOURCE_REV: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          v="$VERSION"
          # Exactly the three packages, each unpacked from its own artifact.
          if [ "$(find out/pkgs -mindepth 1 | wc -l)" != 6 ]; then
            echo "::error::Expected 3 artifacts with one package each"; find out/pkgs; exit 1
          fi
          mkdir -p out/dist
          for name in linux-x64 macos-universal windows-x64; do
            f="out/pkgs/growcontroller-simulator-$name/growcontroller-simulator-$v-$name.zip"
            if [ ! -f "$f" ]; then
              echo "::error::Missing $f"; find out/pkgs; exit 1
            fi
            mv "$f" out/dist/
          done
          rm -r out/pkgs
          (cd web && npm ci --ignore-scripts --no-audit --no-fund && npm run build)
          node tools/third_party.mjs web/dist/THIRD_PARTY_LICENSES.txt --web
          cp LICENSE web/dist/LICENSE.txt
          tar -C web -czf "out/dist/growcontroller-web-$v.tar.gz" dist
          (cd web && npm sbom --sbom-format cyclonedx --omit dev) > out/dist/sbom-web.cdx.json
          node tools/sbom_cpp.mjs "$v" > out/dist/sbom-simulator-cpp.cdx.json
          (cd out/dist && sha256sum -- * > SHA256SUMS)
          # A tag takes its CHANGELOG section (checked in verify); a dry run
          # takes it too if it exists, otherwise the unreleased one.
          section="$v"
          if [ "$EVENT" != push ] && ! awk -v s="## [$v]" 'index($0, s) == 1 {f=1} END {exit !f}' CHANGELOG.md; then
            section="Unreleased"
          fi
          awk -v s="## [$section]" 'index($0, s) == 1 {p=1; next} /^## \[/ {p=0} p' CHANGELOG.md > out/NOTES.md
          if ! grep -q '[^[:space:]]' out/NOTES.md; then
            echo "::error::CHANGELOG.md has no section [$section]"; exit 1
          fi
          printf '\n---\n**Try it without hardware:** download the simulator for your system, unpack, start (see README.txt in the package). Demo password: `demo-passwort`.\n' >> out/NOTES.md
          printf '\n**Home Assistant:** add this repository in the app store of Home Assistant (with advanced mode on in your profile) and install growcontroller (docs/HOME_ASSISTANT.md).\n' >> out/NOTES.md
          cat out/dist/SHA256SUMS
          # Later jobs accept only this checksum list.
          echo "sums=$(sha256sum out/dist/SHA256SUMS | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
          echo "notes=$(sha256sum out/NOTES.md | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release
          path: out/
          retention-days: 7

  # Read-only, on every run (also the dry run): the release files and app
  # images arrive complete and match their checksums before anything can be
  # published, and the app image goes through publish's own push steps
  # (tools/workflows.test.mjs keeps them the same) into a registry on this
  # runner.
  check:
    needs: [verify, build, app-amd64, app-aarch64]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    services:
      registry:
        image: registry:2@sha256:a3d8aaa63ed8681a604f1dea0aa03f100d5895b6a58ace528858a7b332415373
        ports:
          - 5000:5000
    env:
      IMAGE: localhost:5000/wokesay/growcontroller-ha
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release
          path: out
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: growcontroller-ha-*
          path: app
      - name: Check the app images against their checksums and labels
        env:
          VERSION: ${{ needs.verify.outputs.version }}
          REV: ${{ github.event.pull_request.head.sha || github.sha }}
          SUM_AMD64: ${{ needs.app-amd64.outputs.sum }}
          SUM_AARCH64: ${{ needs.app-aarch64.outputs.sum }}
        run: |
          cd app
          echo "$SUM_AMD64  growcontroller-ha-amd64/growcontroller-ha-amd64.tar.gz" | sha256sum -c -
          echo "$SUM_AARCH64  growcontroller-ha-aarch64/growcontroller-ha-aarch64.tar.gz" | sha256sum -c -
          if [ "$(find . -type f | wc -l)" != 2 ]; then
            echo "::error::Expected exactly the two app images"; find .; exit 1
          fi
          for arch in amd64 aarch64; do
            docker load -i "growcontroller-ha-$arch/growcontroller-ha-$arch.tar.gz"
            labels=$(docker image inspect "growcontroller-ha:$arch" --format '{{index .Config.Labels "io.hass.version"}} {{index .Config.Labels "io.hass.arch"}} {{index .Config.Labels "org.opencontainers.image.revision"}}')
            if [ "$labels" != "$VERSION $arch $REV" ]; then
              echo "::error::The $arch image is labelled \"$labels\""; exit 1
            fi
          done
      - name: Push the app image
        id: image
        env:
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          v="$VERSION"
          digests=()
          for arch in amd64 aarch64; do
            docker tag "growcontroller-ha:$arch" "$IMAGE:$v-$arch"
            docker push "$IMAGE:$v-$arch" | tee push.log
            d=$(grep -oE 'digest: sha256:[0-9a-f]{64}' push.log | tail -n 1 | cut -d' ' -f2)
            if [ -z "$d" ]; then echo "::error::No digest for the $arch image"; exit 1; fi
            digests+=("$d")
          done
          # The name Home Assistant pulls, made from exactly the two images
          # pushed here (by digest, so a tag moved meanwhile cannot slip in)
          docker buildx imagetools create -t "$IMAGE:$v" "$IMAGE@${digests[0]}" "$IMAGE@${digests[1]}"
          digest=$(docker buildx imagetools inspect "$IMAGE:$v" --format '{{json .Manifest}}' | jq -r .digest)
          case "$digest" in
            sha256:*) ;;
            *) echo "::error::No digest for $IMAGE:$v"; exit 1 ;;
          esac
          docker buildx imagetools inspect "$IMAGE@$digest" --raw > index.json
          listed=$(jq -r '.manifests[] | .digest + " " + .platform.os + "/" + .platform.architecture' index.json | sort)
          wanted=$(printf '%s linux/amd64\n%s linux/arm64\n' "${digests[0]}" "${digests[1]}" | sort)
          if [ "$listed" != "$wanted" ]; then
            echo "::error::$IMAGE@$digest lists:"; echo "$listed"; exit 1
          fi
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
      - name: Check the files against their checksums
        env:
          SUMS: ${{ needs.build.outputs.sums }}
          NOTES: ${{ needs.build.outputs.notes }}
        run: |
          cd out/dist
          # Checksum list and notes are the ones build produced.
          echo "$SUMS  SHA256SUMS" | sha256sum -c -
          echo "$NOTES  ../NOTES.md" | sha256sum -c -
          sha256sum -c SHA256SUMS
          # Every file to publish is listed, and every listed file is there.
          listed=$(awk '{sub(/^\*/, "", $2); print $2}' SHA256SUMS | sort)
          present=$(find . -maxdepth 1 -type f ! -name SHA256SUMS -printf '%f\n' | sort)
          if [ "$listed" != "$present" ]; then
            echo "::error::SHA256SUMS does not list exactly the files to publish"; exit 1
          fi
          test -s ../NOTES.md

  publish:
    needs: [verify, build, check, app-amd64, app-aarch64]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      id-token: write
      attestations: write
      # the app image in ghcr.io (SD-034)
      packages: write
    env:
      # = image in ha/app/config.yaml (tools/app.test.mjs)
      IMAGE: ghcr.io/wokesay/growcontroller-ha
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release
          path: out
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: growcontroller-ha-*
          path: app
      - name: Check the files against their checksums
        env:
          SUMS: ${{ needs.build.outputs.sums }}
          NOTES: ${{ needs.build.outputs.notes }}
        run: |
          cd out/dist
          # Checksum list and notes are the ones build produced.
          echo "$SUMS  SHA256SUMS" | sha256sum -c -
          echo "$NOTES  ../NOTES.md" | sha256sum -c -
          sha256sum -c SHA256SUMS
          # Every file to publish is listed, and every listed file is there.
          listed=$(awk '{sub(/^\*/, "", $2); print $2}' SHA256SUMS | sort)
          present=$(find . -maxdepth 1 -type f ! -name SHA256SUMS -printf '%f\n' | sort)
          if [ "$listed" != "$present" ]; then
            echo "::error::SHA256SUMS does not list exactly the files to publish"; exit 1
          fi
      - name: Check the app images against their checksums and labels
        env:
          VERSION: ${{ needs.verify.outputs.version }}
          REV: ${{ github.event.pull_request.head.sha || github.sha }}
          SUM_AMD64: ${{ needs.app-amd64.outputs.sum }}
          SUM_AARCH64: ${{ needs.app-aarch64.outputs.sum }}
        run: |
          cd app
          echo "$SUM_AMD64  growcontroller-ha-amd64/growcontroller-ha-amd64.tar.gz" | sha256sum -c -
          echo "$SUM_AARCH64  growcontroller-ha-aarch64/growcontroller-ha-aarch64.tar.gz" | sha256sum -c -
          if [ "$(find . -type f | wc -l)" != 2 ]; then
            echo "::error::Expected exactly the two app images"; find .; exit 1
          fi
          for arch in amd64 aarch64; do
            docker load -i "growcontroller-ha-$arch/growcontroller-ha-$arch.tar.gz"
            labels=$(docker image inspect "growcontroller-ha:$arch" --format '{{index .Config.Labels "io.hass.version"}} {{index .Config.Labels "io.hass.arch"}} {{index .Config.Labels "org.opencontainers.image.revision"}}')
            if [ "$labels" != "$VERSION $arch $REV" ]; then
              echo "::error::The $arch image is labelled \"$labels\""; exit 1
            fi
          done
      - name: The tag still points at the build
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          # The tag (looked up as a tag, not a branch of the same name) must
          # still point at the commit that was built.
          read -r at type < <(gh api "repos/$GH_REPO/git/ref/tags/$REF_NAME" --jq '.object.sha + " " + .object.type')
          if [ "$type" = tag ]; then at=$(gh api "repos/$GH_REPO/git/tags/$at" --jq .object.sha); fi
          if [ "$at" != "$GITHUB_SHA" ]; then
            echo "::error::Tag $REF_NAME moved to $at since the build of $GITHUB_SHA"; exit 1
          fi
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-checksums: out/dist/SHA256SUMS
      # Before the release: if this fails, nothing is released yet, and a
      # second run pushes the same images again.
      - name: Log in to the container registry
        env:
          REGISTRY_TOKEN: ${{ github.token }}
        run: printf '%s' "$REGISTRY_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
      - name: Push the app image
        id: image
        env:
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          v="$VERSION"
          digests=()
          for arch in amd64 aarch64; do
            docker tag "growcontroller-ha:$arch" "$IMAGE:$v-$arch"
            docker push "$IMAGE:$v-$arch" | tee push.log
            d=$(grep -oE 'digest: sha256:[0-9a-f]{64}' push.log | tail -n 1 | cut -d' ' -f2)
            if [ -z "$d" ]; then echo "::error::No digest for the $arch image"; exit 1; fi
            digests+=("$d")
          done
          # The name Home Assistant pulls, made from exactly the two images
          # pushed here (by digest, so a tag moved meanwhile cannot slip in)
          docker buildx imagetools create -t "$IMAGE:$v" "$IMAGE@${digests[0]}" "$IMAGE@${digests[1]}"
          digest=$(docker buildx imagetools inspect "$IMAGE:$v" --format '{{json .Manifest}}' | jq -r .digest)
          case "$digest" in
            sha256:*) ;;
            *) echo "::error::No digest for $IMAGE:$v"; exit 1 ;;
          esac
          docker buildx imagetools inspect "$IMAGE@$digest" --raw > index.json
          listed=$(jq -r '.manifests[] | .digest + " " + .platform.os + "/" + .platform.architecture' index.json | sort)
          wanted=$(printf '%s linux/amd64\n%s linux/arm64\n' "${digests[0]}" "${digests[1]}" | sort)
          if [ "$listed" != "$wanted" ]; then
            echo "::error::$IMAGE@$digest lists:"; echo "$listed"; exit 1
          fi
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
      - name: Log out of the container registry
        if: always()
        run: docker logout ghcr.io
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.image.outputs.digest }}
      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          # Once more right before the release: the tag has not moved since.
          read -r at type < <(gh api "repos/$GH_REPO/git/ref/tags/$REF_NAME" --jq '.object.sha + " " + .object.type')
          if [ "$type" = tag ]; then at=$(gh api "repos/$GH_REPO/git/tags/$at" --jq .object.sha); fi
          if [ "$at" != "$GITHUB_SHA" ]; then
            echo "::error::Tag $REF_NAME moved to $at since the build of $GITHUB_SHA"; exit 1
          fi
          pre=""; case "$REF_NAME" in *-*) pre="--prerelease";; esac
          gh release create "$REF_NAME" $pre --verify-tag --title "$REF_NAME" --notes-file out/NOTES.md out/dist/*
