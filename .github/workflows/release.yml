# SPDX-License-Identifier: AGPL-3.0-or-later
# Release: a tag vX.Y.Z[-...] on main produces the downloads (simulator for
# Windows, macOS and Linux, web app), SBOMs, checksums and a provenance
# attestation as a GitHub release with the matching CHANGELOG section.
# The firmware image goes into a release only once it is signed offline
# (docs/RELEASE.md) – never from CI; CI still builds it on every run.
# Channels (PD-036) are not told apart yet (#19).
#
# Jobs (#29): `verify` checks version and tag, `packages` and `build` make
# every file without write access, `publish` only checks the checksums,
# attests and creates the release; it runs no npm and no build.
# A PR that changes the release machinery runs everything except
# `publish` as a dry run.
name: Release
on:
  push:
    tags: ["v*"]
  pull_request:
    paths:
      - .github/workflows/release.yml
      - .github/workflows/packages.yml
      - tools/package.sh
      - tools/third_party.mjs
      - tools/sbom_cpp.mjs
      - cmake/deps.cmake
      - tools/embed_web.mjs
      - sim/README.txt
      - web/package.json
      - web/package-lock.json
      - VERSION
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # main as well, to check that the tag points at a commit on it
          fetch-depth: 0
      - name: Version and tag
        id: version
        env:
          EVENT: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [ "$(grep -c . VERSION)" != 1 ]; then
            echo "::error::VERSION must have exactly one line"; exit 1
          fi
          v="$(tr -d '\r\n' < VERSION)"
          if ! printf '%s' "$v" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$'; then
            echo "::error::VERSION is not a version: $v"; exit 1
          fi
          web=$(node -p "require('./web/package.json').version")
          if [ "$web" != "$v" ]; then
            echo "::error::web/package.json has $web, VERSION has $v"; exit 1
          fi
          # Checked on every run, so the dry run proves the tag check can work.
          if ! git rev-parse -q --verify origin/main > /dev/null; then
            echo "::error::origin/main was not fetched"; exit 1
          fi
          if [ "$EVENT" = push ]; then
            if [ "v$v" != "$REF_NAME" ]; then
              echo "::error::Tag $REF_NAME does not match VERSION $v"; exit 1
            fi
            rc=0; git merge-base --is-ancestor HEAD origin/main || rc=$?
            case "$rc" in
              0) ;;
              1) echo "::error::Tag $REF_NAME is not on main"; exit 1 ;;
              *) echo "::error::Could not compare $REF_NAME with main"; exit 1 ;;
            esac
            if ! awk -v s="## [$v]" 'index($0, s) == 1 {f=1} END {exit !f}' CHANGELOG.md; then
              echo "::error::CHANGELOG.md has no section [$v]"; exit 1
            fi
          fi
          echo "version=$v" >> "$GITHUB_OUTPUT"

  packages:
    needs: verify
    uses: ./.github/workflows/packages.yml
    with:
      release: true

  build:
    needs: [verify, packages]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      sums: ${{ steps.files.outputs.sums }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          # No cache in a release build.
          package-manager-cache: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          # One folder per artifact: a second artifact cannot overwrite a
          # package with the same file name.
          pattern: growcontroller-simulator-*
          path: out/pkgs
      - name: Web app, licenses, SBOMs, checksums, release notes
        id: files
        env:
          EVENT: ${{ github.event_name }}
          VERSION: ${{ needs.verify.outputs.version }}
          GC_SOURCE_REV: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          v="$VERSION"
          # Exactly the three packages, each unpacked from its own artifact.
          if [ "$(find out/pkgs -mindepth 1 | wc -l)" != 6 ]; then
            echo "::error::Expected 3 artifacts with one package each"; find out/pkgs; exit 1
          fi
          mkdir -p out/dist
          for name in linux-x64 macos-universal windows-x64; do
            f="out/pkgs/growcontroller-simulator-$name/growcontroller-simulator-$v-$name.zip"
            if [ ! -f "$f" ]; then
              echo "::error::Missing $f"; find out/pkgs; exit 1
            fi
            mv "$f" out/dist/
          done
          rm -r out/pkgs
          (cd web && npm ci --ignore-scripts --no-audit --no-fund && npm run build)
          node tools/third_party.mjs web/dist/THIRD_PARTY_LICENSES.txt --web
          cp LICENSE web/dist/LICENSE.txt
          tar -C web -czf "out/dist/growcontroller-web-$v.tar.gz" dist
          (cd web && npm sbom --sbom-format cyclonedx --omit dev) > out/dist/sbom-web.cdx.json
          node tools/sbom_cpp.mjs "$v" > out/dist/sbom-simulator-cpp.cdx.json
          (cd out/dist && sha256sum -- * > SHA256SUMS)
          # A tag takes its CHANGELOG section (checked in verify); a dry run
          # takes it too if it exists, otherwise the unreleased one.
          section="$v"
          if [ "$EVENT" != push ] && ! awk -v s="## [$v]" 'index($0, s) == 1 {f=1} END {exit !f}' CHANGELOG.md; then
            section="Unreleased"
          fi
          awk -v s="## [$section]" 'index($0, s) == 1 {p=1; next} /^## \[/ {p=0} p' CHANGELOG.md > out/NOTES.md
          if ! grep -q '[^[:space:]]' out/NOTES.md; then
            echo "::error::CHANGELOG.md has no section [$section]"; exit 1
          fi
          printf '\n---\n**Try it without hardware:** download the simulator for your system, unpack, start (see README.txt in the package). Demo password: `demo-passwort`.\n' >> out/NOTES.md
          cat out/dist/SHA256SUMS
          # Later jobs accept only this checksum list.
          echo "sums=$(sha256sum out/dist/SHA256SUMS | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release
          path: out/
          retention-days: 7

  # Read-only, on every run (also the dry run): the release files arrive
  # complete and match their checksums before anything can be published.
  check:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release
          path: out
      - name: Check the files against their checksums
        env:
          SUMS: ${{ needs.build.outputs.sums }}
        run: |
          cd out/dist
          # The checksum list is the one build produced, not a replaced one.
          echo "$SUMS  SHA256SUMS" | sha256sum -c -
          sha256sum -c SHA256SUMS
          # Every file to publish is listed, and every listed file is there.
          listed=$(awk '{sub(/^\*/, "", $2); print $2}' SHA256SUMS | sort)
          present=$(find . -maxdepth 1 -type f ! -name SHA256SUMS -printf '%f\n' | sort)
          if [ "$listed" != "$present" ]; then
            echo "::error::SHA256SUMS does not list exactly the files to publish"; exit 1
          fi
          test -s ../NOTES.md

  publish:
    needs: [build, check]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release
          path: out
      - name: Check the files against their checksums
        env:
          SUMS: ${{ needs.build.outputs.sums }}
        run: |
          cd out/dist
          # The checksum list is the one build produced, not a replaced one.
          echo "$SUMS  SHA256SUMS" | sha256sum -c -
          sha256sum -c SHA256SUMS
          # Every file to publish is listed, and every listed file is there.
          listed=$(awk '{sub(/^\*/, "", $2); print $2}' SHA256SUMS | sort)
          present=$(find . -maxdepth 1 -type f ! -name SHA256SUMS -printf '%f\n' | sort)
          if [ "$listed" != "$present" ]; then
            echo "::error::SHA256SUMS does not list exactly the files to publish"; exit 1
          fi
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-checksums: out/dist/SHA256SUMS
      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          # The tag must still point at the commit that was built.
          at=$(gh api "repos/$GH_REPO/commits/$REF_NAME" --jq .sha)
          if [ "$at" != "$GITHUB_SHA" ]; then
            echo "::error::Tag $REF_NAME moved to $at since the build of $GITHUB_SHA"; exit 1
          fi
          pre=""; case "$REF_NAME" in *-*) pre="--prerelease";; esac
          gh release create "$REF_NAME" $pre --verify-tag --title "$REF_NAME" --notes-file out/NOTES.md out/dist/*
