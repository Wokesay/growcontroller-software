# SPDX-License-Identifier: AGPL-3.0-or-later
# Quick checks on every PR and push to main, also for docs-only changes
# (PD-059): architecture rules, change filter, action pins, C++ SBOM,
# licenses (reuse lint), dependency licenses. The full CI (ci.yml) skips
# its heavy jobs for docs-only changes (SD-030).
name: Quick checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  # As in ci.yml: every push to main gets a group of its own.
  group: checks-${{ github.event_name == 'push' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  # The job id `quick` is a required check of the ruleset on main
  # (SD-027, SD-030); renaming it blocks every merge until the ruleset
  # follows.
  quick:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - name: Tools
        run: |
          # reuse and everything it needs only with the hashes in tools/ (#29):
          # wheels only, except reuse itself, built from its hashed source with
          # the hashed backend, never with one fetched on the side
          python3 -m venv "$RUNNER_TEMP/reuse"
          "$RUNNER_TEMP/reuse/bin/pip" install --require-hashes --no-deps --only-binary :all: -r tools/requirements-reuse-build.txt
          "$RUNNER_TEMP/reuse/bin/pip" install --require-hashes --no-deps --no-build-isolation --only-binary :all: --no-binary reuse -r tools/requirements-reuse.txt
          echo "REUSE=$RUNNER_TEMP/reuse/bin/reuse" >> "$GITHUB_ENV"
      - name: Architecture rules
        run: tools/arch_check.sh
      - name: CI and release scripts, workflow pins
        run: node --test tools/ci_changes.test.mjs tools/workflows.test.mjs tools/sbom_cpp.test.mjs tools/app.test.mjs tools/version.test.mjs
      - name: Text keys of the web app
        run: node --test tools/i18n_keys.test.mjs
      - name: Licenses (REUSE, npm dependencies)
        run: |
          "$REUSE" lint
          node --test tools/check_licenses.test.mjs
          node tools/check_licenses.mjs
