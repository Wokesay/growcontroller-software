# Quick checks on every PR and push to main, also for docs-only changes
# (PD-059): architecture rules, change filter, licenses (reuse lint),
# dependency licenses. The full CI (ci.yml) skips its heavy jobs for
# docs-only changes (SD-030).
name: Quick checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  # The job id `quick` is the required check of the ruleset on main
  # (SD-027); renaming it blocks every merge until the ruleset follows.
  quick:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Tools
        run: pipx install reuse==6.2.0
      - name: Architecture rules
        run: tools/arch_check.sh
      - name: Change filter of the full CI
        run: node --test tools/ci_changes.test.mjs
      - name: Licenses (REUSE, npm dependencies)
        run: |
          reuse lint
          node --test tools/check_licenses.test.mjs
          node tools/check_licenses.mjs
