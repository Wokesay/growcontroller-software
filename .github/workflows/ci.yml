# CI des Software-Repos: Architekturregeln, Kern mit Sanitizern, Web-App,
# Ende-zu-Ende im Browser gegen den Simulator.
name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  pruefen:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Werkzeuge
        run: sudo apt-get update && sudo apt-get install -y ninja-build
      - name: Architektur, Kern, Tests, Web-App
        run: tools/ci.sh
      - name: Browser für E2E
        working-directory: web
        run: npx playwright install --with-deps chromium
      - name: Ende-zu-Ende
        working-directory: web
        env:
          CI: "1"
        run: npx playwright test
      - name: E2E-Bericht bei Fehler
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-bericht
          path: build/e2e-*
          retention-days: 14

  firmware:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    container: espressif/idf:v5.4.1
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Web-App bauen und einbetten
        run: |
          cd web && npm ci --ignore-scripts --no-audit --no-fund && npx vite build && cd - >/dev/null
          node tools/embed_web.mjs
      - name: Firmware für ESP32-S3 bauen
        shell: bash
        run: |
          . $IDF_PATH/export.sh
          cd firmware
          idf.py set-target esp32s3
          idf.py build
          idf.py size
      - uses: actions/upload-artifact@v4
        with:
          name: firmware-esp32s3
          path: |
            firmware/build/growcontroller_hub.bin
            firmware/build/bootloader/bootloader.bin
            firmware/build/partition_table/partition-table.bin
          retention-days: 14

  pakete:
    uses: ./.github/workflows/packages.yml
