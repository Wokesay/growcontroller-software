# Baut den Simulator als Download: eine Datei mit eingebetteter Web-App für
# Windows, macOS (Universal: Apple-Chip und Intel) und Linux, mit Kurztest.
# Aufgerufen von ci.yml (Artefakte am Lauf) und release.yml (Anhänge am Release).
name: Pakete
on:
  workflow_call:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  simulator:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            name: linux-x64
            bin: growcontroller-simulator
            cmake: -DCMAKE_EXE_LINKER_FLAGS="-static-libstdc++ -static-libgcc"
          - os: macos-14
            name: macos-universal
            bin: growcontroller-simulator
            cmake: -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64"
          - os: windows-2022
            name: windows-x64
            bin: growcontroller-simulator.exe
            cmake: -DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreaded
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Web-App bauen und einbetten
        run: |
          (cd web && npm ci --ignore-scripts --no-audit --no-fund && npm run build)
          node tools/embed_web.mjs build-pkg/web_assets.cpp
      - name: Simulator bauen
        run: |
          cmake -S . -B build-pkg -DCMAKE_BUILD_TYPE=Release -DGC_BUILD_TESTS=OFF -DGC_WERROR=OFF \
            -DGC_SIM_WEB_ASSETS=build-pkg/web_assets.cpp ${{ matrix.cmake }}
          cmake --build build-pkg --config Release --target gc_sim_server
      - name: Paket und Kurztest (mit Argumenten und Einfachstart)
        run: bash tools/package.sh "${{ matrix.bin }}" "${{ matrix.name }}"
      - name: Zip
        run: |
          cd dist
          if command -v zip > /dev/null; then zip -r "$PKG_ZIP" "$(basename "$PKG_DIR")"; else 7z a "$PKG_ZIP" "$(basename "$PKG_DIR")"; fi
      - uses: actions/upload-artifact@v4
        with:
          name: growcontroller-simulator-${{ matrix.name }}
          path: dist/*.zip
          retention-days: 30
