# SPDX-License-Identifier: AGPL-3.0-or-later
# Builds the Home Assistant app image (SD-034, ha/app/Dockerfile) for one
# architecture, on a runner of that architecture (no emulation), and smoke
# tests it. ci.yml calls it on every code change and release.yml for the
# release (`release: true`: the image goes to an artifact with its checksum
# as output; only release.yml's `publish` pushes it). No write access, no
# cache: every run builds from a freshly pulled base image.
name: App
on:
  workflow_call:
    inputs:
      arch:
        description: amd64 or aarch64 (Home Assistant's names)
        type: string
        required: true
      release:
        type: boolean
        default: false
    outputs:
      sum:
        description: SHA-256 of the saved image (release only)
        value: ${{ jobs.image.outputs.sum }}
permissions:
  contents: read
defaults:
  run:
    # -eo pipefail: a failing command in a pipe fails the step
    shell: bash
jobs:
  image:
    runs-on: ${{ inputs.arch == 'aarch64' && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}
    timeout-minutes: 30
    outputs:
      sum: ${{ steps.save.outputs.sum }}
    env:
      ARCH: ${{ inputs.arch }}
      # Source code link (AGPL-3.0 §13): always the commit (a tag can move)
      GC_SOURCE_REV: ${{ github.event.pull_request.head.sha || github.sha }}
      # The stand-in for the Supervisor: the build's own base image
      STANDIN: alpine:3.24@sha256:294b683cb724975bec92580e1e685676bd4b50bda910ddb8c51d4cabeaec77e6
      # The oldest AppArmor the app's profile must load with: Debian 12's
      # (3.0), the base of Home Assistant's Supervised installation
      DEBIAN: debian:12@sha256:2c037a04925515fdd6ea85ea14a682d0e79931f5e9f5d07b6dbfc6ba12f9e858
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build
        run: |
          case "$ARCH" in amd64|aarch64) ;; *) echo "::error::Unknown architecture $ARCH"; exit 1 ;; esac
          v="$(tr -d '\r\n' < VERSION)"
          # One image, no attestation manifests: the provenance is attested
          # by release.yml for the published image.
          docker build --pull --provenance=false --sbom=false -f ha/app/Dockerfile \
            --build-arg BUILD_VERSION="$v" --build-arg BUILD_ARCH="$ARCH" --build-arg GC_SOURCE_REV="$GC_SOURCE_REV" \
            -t "growcontroller-ha:$ARCH" .
      - name: Smoke test
        run: |
          v="$(tr -d '\r\n' < VERSION)"
          img="growcontroller-ha:$ARCH"
          # What the Supervisor reads from the image, and its size
          labels=$(docker image inspect "$img" --format '{{index .Config.Labels "io.hass.version"}} {{index .Config.Labels "io.hass.type"}} {{index .Config.Labels "io.hass.arch"}} {{index .Config.Labels "org.opencontainers.image.revision"}}')
          if [ "$labels" != "$v app $ARCH $GC_SOURCE_REV" ]; then
            echo "::error::Image labels are \"$labels\""; exit 1
          fi
          size=$(docker image inspect "$img" --format '{{.Size}}')
          echo "Image size: $size bytes"
          if [ "$size" -gt 15000000 ]; then echo "::error::The image grew past 15 MB"; exit 1; fi
          # Refused without the Supervisor's token, or with a file of its own
          rc=0; docker run --rm "$img" > /dev/null 2>&1 || rc=$?
          if [ "$rc" != 2 ]; then echo "::error::Without SUPERVISOR_TOKEN the app ended with $rc, not 2"; exit 1; fi
          rc=0; docker run --rm -e SUPERVISOR_TOKEN=smoke-test "$img" --config /x > /dev/null 2>&1 || rc=$?
          if [ "$rc" != 2 ]; then echo "::error::--config was not refused ($rc)"; exit 1; fi
          # A stand-in for the Supervisor on a network of its own: it answers
          # every request with an empty list of states and keeps what it was
          # asked. The app finds it by name in its /etc/hosts, where Home
          # Assistant puts the Supervisor's address.
          docker network create gc-smoke
          docker run -d --name supervisor --network gc-smoke "$STANDIN" sh -c \
            'while true; do printf "HTTP/1.1 200 OK\r\nContent-Type: application/json\r\nContent-Length: 2\r\nConnection: close\r\n\r\n[]" | nc -l -p 80 >> /tmp/requests 2>&1; done'
          supervisor=$(docker inspect supervisor --format '{{(index .NetworkSettings.Networks "gc-smoke").IPAddress}}')
          # The app's AppArmor profile (#80). The Supervisor loads it with the
          # host's parser and fails the install or update if that refuses it,
          # so the oldest parser it may meet reads it too.
          docker run --rm -v "$PWD/ha/app/apparmor.txt:/apparmor.txt:ro" "$DEBIAN" sh -ec '
            apt-get update -qq
            DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends apparmor > /dev/null
            apparmor_parser --version | head -n 1
            apparmor_parser -Q -K /apparmor.txt'
          # Loaded and renamed as the Supervisor does it; every start below
          # runs in it.
          sed 's/^profile growcontroller /profile 0000ci00_growcontroller /' ha/app/apparmor.txt > "$RUNNER_TEMP/apparmor.txt"
          grep -q '^profile 0000ci00_growcontroller ' "$RUNNER_TEMP/apparmor.txt"
          sudo apparmor_parser -r -W "$RUNNER_TEMP/apparmor.txt"
          # The app's own folder, mounted at /data as Home Assistant mounts it,
          # with a file a version before #80 left there as root.
          docker volume create gc-data > /dev/null
          docker run --rm -v gc-data:/data "$STANDIN" sh -ec 'mkdir -m 700 /data/hub; echo old > /data/hub/before-80; chmod 600 /data/hub/before-80'
          # Started like the Supervisor starts it: as root behind docker-init,
          # in its profile, a token and the time zone in the environment, no
          # arguments.
          start() {
            docker run -d --name "$1" --init --security-opt apparmor=0000ci00_growcontroller --network gc-smoke --add-host "supervisor:$supervisor" \
              -v "$2:/data" -e SUPERVISOR_TOKEN=smoke-test -e TZ=Europe/Berlin -p 127.0.0.1:8099:8099 "$img"
          }
          answers() {
            for _ in $(seq 1 30); do
              if curl -fsS http://127.0.0.1:8099/api/v1/info -o info.json; then return 0; fi
              sleep 1
            done
            docker logs "$1"; echo "::error::The app did not answer"; return 1
          }
          start app gc-data
          answers app
          jq -e --arg v "$v" '.version == $v and .platform.kind == "home-assistant" and .platform.readOnly == true' info.json
          # The server, docker-init's child, answers as an account of its own:
          # no root, no capabilities, no way to gain them, in its profile (#80).
          confined() {
            init=$(docker inspect "$1" --format '{{.State.Pid}}')
            server=$(pgrep -P "$init")
            grep -E '^(Uid|Gid|Groups|CapPrm|CapEff|CapAmb|NoNewPrivs):' "/proc/$server/status" | awk '{$1=$1; print}' > status.txt
            cat status.txt
            for want in 'Uid: 65532 65532 65532 65532' 'Gid: 65532 65532 65532 65532' 'Groups:' 'CapPrm: 0000000000000000' 'CapEff: 0000000000000000' 'CapAmb: 0000000000000000' 'NoNewPrivs: 1'; do
              grep -qxF "$want" status.txt || { echo "::error::$1 does not run with \"$want\" (#80)"; return 1; }
            done
            profile=$(sudo cat "/proc/$server/attr/current" | tr -d '\0')
            if [ "$profile" != "0000ci00_growcontroller (enforce)" ]; then echo "::error::$1 runs in \"$profile\""; return 1; fi
          }
          confined app
          # The first password needs the setup code from the app's log (#79).
          jq -e '.hasPassword == false and .setupCode == true' info.json
          setup_code=""
          for _ in $(seq 1 10); do
            docker logs app > start.log 2>&1
            setup_code=$(sed -nE 's/^Setup code for the first password: ([2-9A-HJ-NP-Z]{4}(-[2-9A-HJ-NP-Z]{4}){3})$/\1/p' start.log)
            if [ -n "$setup_code" ]; then break; fi
            sleep 1
          done
          if [ -z "$setup_code" ]; then cat start.log; echo "::error::No setup code in the app's log"; exit 1; fi
          code=$(curl -sS -o /dev/null -w '%{http_code}' -H 'Content-Type: application/json' -d '{"password":"smoke-test-1"}' http://127.0.0.1:8099/api/v1/auth/setup)
          if [ "$code" != 403 ]; then echo "::error::The first password without the code got $code, not 403"; exit 1; fi
          code=$(curl -sS -o /dev/null -w '%{http_code}' -H 'Content-Type: application/json' -d "{\"password\":\"smoke-test-1\",\"code\":\"$setup_code\"}" http://127.0.0.1:8099/api/v1/auth/setup)
          if [ "$code" != 200 ]; then echo "::error::The first password with the code got $code, not 200"; exit 1; fi
          curl -fsS http://127.0.0.1:8099/ -o index.html
          grep -q '<div id="app"' index.html
          # and the files it loads, which the server's account must read too
          grep -oE '/assets/[^"]+[.]js' index.html > assets.txt
          test -s assets.txt
          curl -fsS "http://127.0.0.1:8099$(sed -n 1p assets.txt)" -o /dev/null
          code=$(curl -sS -o /dev/null -w '%{http_code}' -H 'Host: example.com' http://127.0.0.1:8099/api/v1/info)
          if [ "$code" != 403 ]; then echo "::error::A foreign host name got $code, not 403"; exit 1; fi
          # The longest paths the web server still matches with its recursive
          # regular expressions (256 characters, on musl's thread stacks)
          # leave the app running.
          curl -s -o /dev/null "http://127.0.0.1:8099/$(printf 'a%.0s' $(seq 1 255))" || true
          curl -s -o /dev/null "http://127.0.0.1:8099/api/v1/$(printf 'a%.0s' $(seq 1 248))" || true
          curl -fsS http://127.0.0.1:8099/api/v1/info -o /dev/null || { docker logs app; echo "::error::A long path took the app down"; exit 1; }
          # It reached the Supervisor by name with its token, read only the
          # states, and reported no problem with them (a good read logs
          # nothing). Read from files: under pipefail an early-ending grep
          # in a pipe could hide a match.
          sleep 6
          docker logs app > app.log 2>&1
          cat app.log
          docker exec supervisor cat /tmp/requests > requests.txt
          cat requests.txt
          grep -q '^GET /core/api/states HTTP/1.1' requests.txt
          grep -q '^Authorization: Bearer smoke-test' requests.txt
          grep -E '^[A-Z]+ ' requests.txt | grep -v '^GET /core/api/states HTTP/1.1' > other.txt || true
          if [ -s other.txt ]; then echo "::error::The app asked the Supervisor for more than the states"; exit 1; fi
          grep '^Home Assistant: ' app.log | grep -v 'no Date header' > problems.txt || true
          if [ -s problems.txt ]; then echo "::error::The app reported a problem with the stand-in"; exit 1; fi
          # Stopped as the Supervisor stops it; the data folder is private.
          docker stop -t 10 app
          code=$(docker inspect app --format '{{.State.ExitCode}}')
          if [ "$code" != 0 ]; then echo "::error::The app ended with $code on SIGTERM"; exit 1; fi
          docker cp app:/data/hub hub
          if [ "$(stat -c %a hub)" != 700 ] || [ -z "$(find hub -type f)" ] || [ -n "$(find hub -type f ! -perm 600)" ]; then
            echo "::error::The data folder is empty or not private"; ls -la hub; exit 1
          fi
          # Everything in it is the app's account's, the file from before #80 too.
          docker run --rm -v gc-data:/data "$STANDIN" sh -ec 'test -f /data/hub/before-80; find /data/hub \( ! -user 65532 -o ! -group 65532 \) -print' > foreign.txt
          if [ -s foreign.txt ]; then echo "::error::Not the app's: $(cat foreign.txt)"; exit 1; fi
          # Started again, it enters its folder, now its account's, as root
          # once more (dac_override) and still ends as it should.
          docker start app > /dev/null
          answers app
          confined app
          docker stop -t 10 app
          code=$(docker inspect app --format '{{.State.ExitCode}}')
          if [ "$code" != 0 ]; then echo "::error::The app ended with $code on SIGTERM after a restart"; exit 1; fi
          # A new install: /data empty, as the Supervisor creates it. The
          # server makes its folder in the profile, private and its own.
          docker volume create gc-fresh > /dev/null
          start fresh gc-fresh
          answers fresh
          confined fresh
          docker stop -t 10 fresh
          code=$(docker inspect fresh --format '{{.State.ExitCode}}')
          if [ "$code" != 0 ]; then echo "::error::A new install ended with $code on SIGTERM"; exit 1; fi
          made=$(docker run --rm -v gc-fresh:/data "$STANDIN" stat -c '%u:%g %a' /data/hub)
          if [ "$made" != "65532:65532 700" ]; then echo "::error::A new install made its folder as $made"; exit 1; fi
          docker rm fresh
          docker volume rm gc-fresh
          # Its profile refused nothing it did,
          sleep 2
          sudo dmesg > dmesg.txt
          test -s dmesg.txt
          grep 'apparmor="DENIED"' dmesg.txt | grep -F 'profile="0000ci00_growcontroller"' > denied.txt || true
          if [ -s denied.txt ]; then cat denied.txt; echo "::error::The app's AppArmor profile refused it something"; exit 1; fi
          # and a refusal would show: a file the profile does not allow, read
          # in it, is refused and logged (the kernel logs it a moment later).
          rc=0; docker run --rm --security-opt apparmor=0000ci00_growcontroller "$STANDIN" cat /etc/passwd > /dev/null 2>&1 || rc=$?
          if [ "$rc" = 0 ]; then echo "::error::The profile let a tool read /etc/passwd"; exit 1; fi
          seen=""
          for _ in $(seq 1 10); do
            sudo dmesg > dmesg.txt
            if grep -qE 'apparmor="DENIED".* profile="0000ci00_growcontroller".* name="/etc/passwd"' dmesg.txt; then seen=1; break; fi
            sleep 1
          done
          if [ -z "$seen" ]; then echo "::error::A refusal of the profile does not show in the kernel log"; exit 1; fi
          # The license texts and the source code link are in the image.
          docker cp app:/licenses licenses
          for f in LICENSE.txt THIRD_PARTY_LICENSES.txt musl-COPYRIGHT.txt BUILD_PACKAGES.txt; do
            test -s "licenses/$f" || { echo "::error::/licenses/$f is missing"; exit 1; }
          done
          cat licenses/BUILD_PACKAGES.txt
          docker cp app:/web web-out
          grep -rqF "$GC_SOURCE_REV" web-out/assets || { echo "::error::The web app has no link to $GC_SOURCE_REV"; exit 1; }
          docker rm app
          docker volume rm gc-data
          docker rm -f supervisor
          docker network rm gc-smoke
      # The image's server is linked against musl and the GCC runtime of its
      # Alpine base, the other jobs test on Ubuntu's toolchain (#112).
      - name: Core tests with the image's toolchain
        timeout-minutes: 15
        run: |
          # gc_tests built as the image builds its server: in the same base,
          # with its packages and options (tools/app.test.mjs compares them)
          docker run --rm -v "$PWD:/src:ro" "$STANDIN" sh -ec '
            apk add --no-cache build-base cmake ninja linux-headers > /dev/null
            cmake -S /src -B /tmp/build -G Ninja -DCMAKE_BUILD_TYPE=Release -DGC_WERROR=OFF \
              "-DCMAKE_EXE_LINKER_FLAGS=-static-pie -Wl,-z,stack-size=1048576"
            cmake --build /tmp/build --target gc_tests
            /tmp/build/gc_tests'
      - name: The image's server against a stand-in Home Assistant
        timeout-minutes: 5
        run: |
          # The binary that ships, with values a stand-in Home Assistant
          # reports: a number, an unavailable sensor, a unit to convert (#112),
          # and as root, as the Supervisor starts it, giving up root (#80).
          # CI set: a missing binary fails instead of skipping; GC_HA_ROOT_TEST
          # set: the tests as root fail instead of skipping.
          docker create --name shipped "growcontroller-ha:$ARCH" > /dev/null
          docker cp shipped:/gc_ha_server "$RUNNER_TEMP/gc_ha_server"
          docker rm shipped > /dev/null
          docker run --rm -v "$PWD:/src:ro" -v "$RUNNER_TEMP/gc_ha_server:/gc_ha_server:ro" -w /src \
            -e CI=true -e GC_HA_SERVER=/gc_ha_server -e GC_HA_ROOT_TEST=1 "$STANDIN" sh -ec '
            apk add --no-cache nodejs > /dev/null
            node --test tools/ha_server.test.mjs'
      - name: Save the image
        id: save
        if: inputs.release
        run: |
          mkdir -p out
          docker save "growcontroller-ha:$ARCH" | gzip -n > "out/growcontroller-ha-$ARCH.tar.gz"
          ls -l out
          # release.yml accepts only this checksum.
          echo "sum=$(sha256sum "out/growcontroller-ha-$ARCH.tar.gz" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: inputs.release
        with:
          name: growcontroller-ha-${{ inputs.arch }}
          path: out/growcontroller-ha-${{ inputs.arch }}.tar.gz
          retention-days: 7
